<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatphongHubx Enterprise System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .status-box { 
            padding: 15px; 
            background: #0f172a; 
            border-radius: 8px; 
            font-weight: 600; 
            color: #4ade80; 
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChatphongHubx Enterprise System</h1>
        <p>ระบบจัดการการซื้อขายและระบบคีย์อัจฉริยะพร้อมใช้งาน</p>
        <div class="status-box" id="system-status">กำลังตรวจสอบสถานะเซิร์ฟเวอร์...</div>
    </div>

    <script>
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                const statusBox = document.getElementById('system-status');
                statusBox.innerText = `สถานะระบบ: ${data.status.toUpperCase()} - พร้อมใช้งาน`;
            })
            .catch(err => {
                const statusBox = document.getElementById('system-status');
                statusBox.innerText = 'สถานะระบบ: ออฟไลน์ (Offline)';
                statusBox.style.color = '#f87171';
            });
    </script>
</body>
</html>
